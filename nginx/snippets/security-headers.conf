# Sicherheits-Header fuer statische Seiten.
# Wichtig: nginx vererbt add_header NICHT in location-Bloecke, die selbst add_header setzen.
# Deshalb diese Datei in server{} UND in jedem location{} mit eigenem add_header includen.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), fullscreen=(self)" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# CSP: an die eigene Seite anpassen. Externe Quellen (Bilder, iframes, APIs) explizit ergaenzen,
# z. B. img-src ... https://upload.wikimedia.org;  frame-src https://www.youtube-nocookie.com;
# 'self' deckt auch Cloudflares Bot-Skript unter /cdn-cgi/ ab.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'; worker-src 'self'; upgrade-insecure-requests" always;
